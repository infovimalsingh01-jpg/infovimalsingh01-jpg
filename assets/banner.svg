<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="canvas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#080e1e" />
      <stop offset="100%" stop-color="#03060d" />
    </linearGradient>

    <!-- Native Radial Ambient Glows -->
    <radialGradient id="radial-left" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#0078d4" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radial-right" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radial-center" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradients -->
    <linearGradient id="neon-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="25%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#ff9900" />
      <stop offset="75%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="terminal-header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111c33" />
      <stop offset="100%" stop-color="#0c1322" />
    </linearGradient>

    <!-- Ultra-Crisp High-Contrast Text Gradient -->
    <linearGradient id="crystal-name" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e0f2fe" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Simple CSS Keyframe Animations -->
    <style>
      @keyframes dashFlow {
        from { stroke-dashoffset: 120; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes floatY {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .anim-flow {
        stroke-dasharray: 10, 8;
        animation: dashFlow 4s linear infinite;
      }
      .anim-blink {
        animation: blinkCursor 1s infinite;
      }
      .anim-pulse {
        animation: pulseDot 2.5s ease-in-out infinite;
      }
      .anim-float {
        animation: floatY 4s ease-in-out infinite;
      }
      .font-mono {
        font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="380" rx="18" fill="url(#canvas-bg)" stroke="url(#neon-border)" stroke-width="2" />

  <!-- Native Radial Glows -->
  <rect width="1200" height="380" rx="18" fill="url(#radial-left)" />
  <rect width="1200" height="380" rx="18" fill="url(#radial-right)" />
  <rect width="1200" height="380" rx="18" fill="url(#radial-center)" />

  <!-- Blueprint Subtle Background Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="80" y1="0" x2="80" y2="380" />
    <line x1="200" y1="0" x2="200" y2="380" />
    <line x1="340" y1="0" x2="340" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="860" y1="0" x2="860" y2="380" />
    <line x1="1000" y1="0" x2="1000" y2="380" />
    <line x1="1120" y1="0" x2="1120" y2="380" />
  </g>

  <!-- Corner Tech Accents -->
  <g stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 12 30 L 12 12 L 30 12" />
    <path d="M 1170 12 L 1188 12 L 1188 30" />
    <path d="M 12 350 L 12 368 L 30 368" />
    <path d="M 1170 368 L 1188 368 L 1188 350" />
  </g>

  <!-- ======================== LEFT: LIVE MULTI-CLOUD & DATA TERMINAL ======================== -->
  <g transform="translate(40, 40)" class="anim-float">
    <!-- Terminal Window Container -->
    <rect x="0" y="0" width="310" height="300" rx="12" fill="#080e1a" stroke="#1e293b" stroke-width="1.5" />
    <!-- Terminal Header -->
    <rect x="0" y="0" width="310" height="34" rx="12" fill="url(#terminal-header-grad)" />
    <rect x="0" y="24" width="310" height="10" fill="url(#terminal-header-grad)" />
    <line x1="0" y1="34" x2="310" y2="34" stroke="#1e293b" stroke-width="1" />
    
    <!-- Window Control Buttons -->
    <circle cx="18" cy="17" r="4.5" fill="#ef4444" />
    <circle cx="32" cy="17" r="4.5" fill="#f59e0b" />
    <circle cx="46" cy="17" r="4.5" fill="#10b981" />
    <text x="175" y="21" text-anchor="middle" fill="#64748b" class="font-mono" font-size="11" font-weight="600">vimal@multi-cloud-core ~</text>

    <!-- Terminal Output Code -->
    <g transform="translate(16, 54)" class="font-mono" font-size="10.5">
      <text x="0" y="0" fill="#38bdf8" font-weight="700">❯ <tspan fill="#f1f5f9">docker build -t cloud-app</tspan></text>
      <text x="0" y="16" fill="#10b981">✔ Multi-stage image built (Alpine)</text>

      <text x="0" y="36" fill="#38bdf8" font-weight="700">❯ <tspan fill="#f1f5f9">terraform apply (Multi-Cloud)</tspan></text>
      <text x="0" y="52" fill="#00f2fe">✔ Azure • AWS • GCP State Locked</text>

      <text x="0" y="72" fill="#38bdf8" font-weight="700">❯ <tspan fill="#f1f5f9">mssql-cli --query "DB Cluster Check"</tspan></text>
      <text x="0" y="88" fill="#f87171">✔ MS SQL AlwaysOn HA: Online</text>

      <text x="0" y="108" fill="#38bdf8" font-weight="700">❯ <tspan fill="#f1f5f9">tableau-bridge status --active</tspan></text>
      <text x="0" y="124" fill="#fb923c">✔ Tableau Cloud &amp; Bridge: Synced</text>

      <text x="0" y="144" fill="#38bdf8" font-weight="700">❯ <tspan fill="#f1f5f9">kubectl get nodes -A</tspan></text>
      <text x="0" y="160" fill="#e2e8f0">AKS/EKS: 100% Ready <tspan fill="#00f2fe" class="anim-blink">▋</tspan></text>
    </g>

    <!-- Terminal Footer Badge -->
    <rect x="0" y="268" width="310" height="32" rx="0" fill="#060a13" />
    <rect x="0" y="288" width="310" height="12" rx="12" fill="#060a13" />
    <line x1="0" y1="268" x2="310" y2="268" stroke="#1e293b" stroke-width="1" />
    <circle cx="20" cy="284" r="4" fill="#10b981" class="anim-pulse" />
    <text x="32" y="288" fill="#94a3b8" class="font-mono" font-size="10" font-weight="600">ZERO DRIFT • MULTI-CLOUD • BI &amp; SQL</text>
  </g>


  <!-- ======================== CENTER: IDENTITY & MULTI-CLOUD / DATA ARCHITECT ======================== -->
  <g transform="translate(600, 46)" text-anchor="middle">

    <!-- Top Futuristic System Badge -->
    <g transform="translate(0, -12)">
      <rect x="-240" y="0" width="480" height="26" rx="13" fill="#0d172a" stroke="#00f2fe" stroke-width="1.2" />
      <circle cx="-215" cy="13" r="4.5" fill="#00f2fe" class="anim-pulse" />
      <text x="0" y="18" fill="#00f2fe" class="font-mono" font-weight="800" font-size="10.5" letter-spacing="1.2">
        SENIOR DEVOPS &amp; ENTERPRISE DATA PLATFORMS // SRE
      </text>
    </g>

    <!-- MAIN NAME: Crystal Clear, High Contrast, Razor Sharp -->
    <g transform="translate(0, 46)">
      <!-- Deep dark shadow for 100% legibility on any monitor -->
      <text x="2" y="2" fill="#000000" opacity="0.9" class="font-sans" font-weight="900" font-size="40" letter-spacing="2">
        VIMAL PRATAP SINGH
      </text>
      <text x="0" y="0" fill="url(#crystal-name)" class="font-sans" font-weight="900" font-size="40" letter-spacing="2">
        VIMAL PRATAP SINGH
      </text>
    </g>

    <!-- Subtitle Role & Focus: Highlighting Azure, AWS, GCP, K8s, Tableau, Power BI & MS SQL -->
    <text x="0" y="78" fill="#38bdf8" class="font-sans" font-weight="600" font-size="14" letter-spacing="0.5">
      Multi-Cloud (Azure • AWS • GCP)  |  K8s &amp; Docker  |  Tableau • Power BI • MS SQL
    </text>

    <!-- Continuous Pipeline Ribbon -->
    <g transform="translate(0, 98)">
      <rect x="-240" y="0" width="480" height="24" rx="12" fill="#091020" stroke="#334155" stroke-width="1" />
      <text x="0" y="16" fill="#cbd5e1" class="font-mono" font-size="10" font-weight="600">
        <tspan fill="#a855f7">Git Repo</tspan> ➔ <tspan fill="#38bdf8">TFLint</tspan> ➔ <tspan fill="#ef4444">DevSecOps</tspan> ➔ <tspan fill="#10b981">FinOps</tspan> ➔ <tspan fill="#e97627">MS SQL</tspan> ➔ <tspan fill="#00f2fe">Tableau BI</tspan>
      </text>
    </g>

    <!-- Tech Stack Pill Arsenal (Row 1: Containers, IaC & DevSecOps) -->
    <g transform="translate(0, 136)">
      <!-- Pill 1: Docker -->
      <g transform="translate(-235, 0)">
        <rect x="0" y="0" width="100" height="28" rx="7" fill="#0f172a" stroke="#2496ed" stroke-width="1.3" />
        <text x="50" y="19" fill="#60a5fa" class="font-mono" font-weight="700" font-size="11">🐳 Docker</text>
      </g>
      <!-- Pill 2: Kubernetes -->
      <g transform="translate(-125, 0)">
        <rect x="0" y="0" width="115" height="28" rx="7" fill="#0f172a" stroke="#326ce5" stroke-width="1.3" />
        <text x="57" y="19" fill="#93c5fd" class="font-mono" font-weight="700" font-size="11">☸ Kubernetes</text>
      </g>
      <!-- Pill 3: Terraform -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="110" height="28" rx="7" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.3" />
        <text x="55" y="19" fill="#d8b4fe" class="font-mono" font-weight="700" font-size="11">⬡ Terraform</text>
      </g>
      <!-- Pill 4: DevSecOps -->
      <g transform="translate(120, 0)">
        <rect x="0" y="0" width="115" height="28" rx="7" fill="#0f172a" stroke="#10b981" stroke-width="1.3" />
        <text x="57" y="19" fill="#6ee7b7" class="font-mono" font-weight="700" font-size="11">🛡️ DevSecOps</text>
      </g>
    </g>

    <!-- Tech Stack Pill Arsenal (Row 2: Multi-Cloud Platforms & MS SQL Server) -->
    <g transform="translate(0, 172)">
      <!-- Cloud 1: Microsoft Azure -->
      <g transform="translate(-235, 0)">
        <rect x="0" y="0" width="100" height="28" rx="7" fill="#0c192e" stroke="#0078d4" stroke-width="1.3" />
        <text x="50" y="19" fill="#38bdf8" class="font-mono" font-weight="700" font-size="11">☁ Azure</text>
      </g>
      <!-- Cloud 2: Amazon AWS -->
      <g transform="translate(-125, 0)">
        <rect x="0" y="0" width="100" height="28" rx="7" fill="#1c160c" stroke="#ff9900" stroke-width="1.3" />
        <text x="50" y="19" fill="#fbbf24" class="font-mono" font-weight="700" font-size="11">🟧 AWS</text>
      </g>
      <!-- Cloud 3: Google GCP -->
      <g transform="translate(-15, 0)">
        <rect x="0" y="0" width="100" height="28" rx="7" fill="#0c1724" stroke="#4285f4" stroke-width="1.3" />
        <text x="50" y="19" fill="#60a5fa" class="font-mono" font-weight="700" font-size="11">🌐 GCP</text>
      </g>
      <!-- DB: MS SQL Server -->
      <g transform="translate(95, 0)">
        <rect x="0" y="0" width="140" height="28" rx="7" fill="#1e1012" stroke="#cc292b" stroke-width="1.3" />
        <text x="70" y="19" fill="#f87171" class="font-mono" font-weight="700" font-size="11">🗄️ MS SQL Server</text>
      </g>
    </g>

    <!-- Tech Stack Pill Arsenal (Row 3: Tableau Ecosystem & Power BI) -->
    <g transform="translate(0, 208)">
      <!-- Tableau Suite: Server, Cloud, Bridge -->
      <g transform="translate(-235, 0)">
        <rect x="0" y="0" width="270" height="28" rx="7" fill="#1e140d" stroke="#e97627" stroke-width="1.3" />
        <text x="135" y="19" fill="#fdba74" class="font-mono" font-weight="700" font-size="11">📊 Tableau (Server • Cloud • Bridge)</text>
      </g>
      <!-- Microsoft Power BI -->
      <g transform="translate(45, 0)">
        <rect x="0" y="0" width="190" height="28" rx="7" fill="#1e1a0b" stroke="#f59e0b" stroke-width="1.3" />
        <text x="95" y="19" fill="#fde047" class="font-mono" font-weight="700" font-size="11">📈 Microsoft Power BI</text>
      </g>
    </g>

    <!-- Bottom Telemetry Status Strip -->
    <g transform="translate(0, 252)">
      <rect x="-240" y="0" width="480" height="24" rx="12" fill="#060c18" stroke="#1e293b" stroke-width="1" />
      <circle cx="-225" cy="12" r="3.5" fill="#10b981" class="anim-pulse" />
      <text x="-212" y="16" text-anchor="start" fill="#94a3b8" class="font-mono" font-size="9" font-weight="600">
        MULTI-CLOUD ARCHITECTURE  •  ENTERPRISE BI &amp; SQL  •  99.99% UPTIME
      </text>
    </g>

  </g>


  <!-- ======================== RIGHT: ENTERPRISE TELEMETRY & DATA PLATFORM ======================== -->
  <g transform="translate(850, 40)">
    <!-- Container Card -->
    <rect x="0" y="0" width="310" height="300" rx="12" fill="#080e1a" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Card Header Bar -->
    <rect x="0" y="0" width="310" height="34" rx="12" fill="url(#terminal-header-grad)" />
    <rect x="0" y="24" width="310" height="10" fill="url(#terminal-header-grad)" />
    <line x1="0" y1="34" x2="310" y2="34" stroke="#1e293b" stroke-width="1" />
    <circle cx="20" cy="17" r="4.5" fill="#38bdf8" />
    <text x="34" y="21" fill="#f8fafc" class="font-mono" font-size="10.5" font-weight="700">ENTERPRISE TELEMETRY &amp; DATA</text>

    <!-- Inner Central Core Glyph -->
    <g transform="translate(155, 78)">
      <!-- Outer Dashed Ring -->
      <circle cx="0" cy="0" r="32" fill="none" stroke="#334155" stroke-width="1.5" />
      <circle cx="0" cy="0" r="32" fill="none" stroke="#00f2fe" stroke-width="2" class="anim-flow" />

      <!-- Center Hexagon Shield -->
      <polygon points="0,-20 18,-10 18,10 0,20 -18,10 -18,-10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.8" />
      
      <!-- Cluster Core Glyph Inside -->
      <circle cx="0" cy="0" r="7" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.2" />
      <path d="M-4 0 L4 0 M0 -4 L0 4" stroke="#00f2fe" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- Telemetry Status Metrics Below -->
    <g transform="translate(20, 122)">
      <!-- Metric 1: Multi-Cloud State Lock -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="270" height="38" rx="8" fill="#0d172a" stroke="#0078d4" stroke-width="1.2" />
        <circle cx="16" cy="19" r="4" fill="#0078d4" />
        <text x="28" y="16" fill="#f8fafc" class="font-sans" font-size="10.5" font-weight="700">Multi-Cloud Remote State</text>
        <text x="28" y="30" fill="#38bdf8" class="font-mono" font-size="9">Azure Blob • AWS S3 • State Lock</text>
        <text x="255" y="24" text-anchor="end" fill="#10b981" class="font-mono" font-size="11" font-weight="800">✔</text>
      </g>

      <!-- Metric 2: Containers & Drift -->
      <g transform="translate(0, 46)">
        <rect x="0" y="0" width="270" height="38" rx="8" fill="#0d172a" stroke="#10b981" stroke-width="1.2" />
        <circle cx="16" cy="19" r="4" fill="#10b981" class="anim-pulse" />
        <text x="28" y="16" fill="#f8fafc" class="font-sans" font-size="10.5" font-weight="700">Continuous Drift &amp; Containers</text>
        <text x="28" y="30" fill="#34d399" class="font-mono" font-size="9">Docker • AKS/EKS • Zero Drift (0 Diff)</text>
        <text x="255" y="24" text-anchor="end" fill="#10b981" class="font-mono" font-size="11" font-weight="800">✔</text>
      </g>

      <!-- Metric 3: Enterprise BI & Data Platforms -->
      <g transform="translate(0, 92)">
        <rect x="0" y="0" width="270" height="38" rx="8" fill="#0d172a" stroke="#e97627" stroke-width="1.2" />
        <circle cx="16" cy="19" r="4" fill="#e97627" />
        <text x="28" y="16" fill="#f8fafc" class="font-sans" font-size="10.5" font-weight="700">Enterprise BI &amp; Data Flow</text>
        <text x="28" y="30" fill="#fb923c" class="font-mono" font-size="9">Tableau Server/Bridge • MS SQL • Power BI</text>
        <text x="255" y="24" text-anchor="end" fill="#10b981" class="font-mono" font-size="11" font-weight="800">✔</text>
      </g>
    </g>

    <!-- Telemetry Card Footer -->
    <rect x="0" y="268" width="310" height="32" rx="0" fill="#060a13" />
    <rect x="0" y="288" width="310" height="12" rx="12" fill="#060a13" />
    <line x1="0" y1="268" x2="310" y2="268" stroke="#1e293b" stroke-width="1" />
    <circle cx="20" cy="284" r="4" fill="#10b981" class="anim-pulse" />
    <text x="32" y="288" fill="#94a3b8" class="font-mono" font-size="10" font-weight="600">LIVE SYNC • HIGH AVAILABILITY ACTIVE</text>
  </g>

</svg>
