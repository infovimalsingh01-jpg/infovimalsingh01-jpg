<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="40%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#080c18" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purple-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#7928ca" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#0078d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseAura {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.04); }
      }
      @keyframes floatBadges {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes floatBadgesReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(5px); }
      }
      @keyframes lineDash {
        from { stroke-dashoffset: 100; }
        to { stroke-dashoffset: 0; }
      }
      .anim-aura {
        animation: pulseAura 6s ease-in-out infinite;
        transform-origin: center;
      }
      .float-1 {
        animation: floatBadges 4s ease-in-out infinite;
      }
      .float-2 {
        animation: floatBadgesReverse 5s ease-in-out infinite;
      }
      .main-title {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Montserrat', Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: 1.5px;
      }
      .sub-title {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 600;
        letter-spacing: 0.8px;
      }
      .exp-pill {
        font-family: 'SF Pro Text', 'Fira Code', monospace;
        font-weight: 700;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Banner Outer Border & Background -->
  <rect width="1200" height="360" rx="24" fill="url(#banner-bg)" stroke="url(#border-grad)" stroke-width="2" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="150" cy="180" r="160" fill="#00f2fe" opacity="0.07" filter="url(#glow)" class="anim-aura" />
  <circle cx="1050" cy="180" r="180" fill="#7928ca" opacity="0.08" filter="url(#glow)" class="anim-aura" />
  <circle cx="600" cy="60" r="130" fill="#0078d4" opacity="0.06" filter="url(#glow)" class="anim-aura" />

  <!-- Background Decorative Grid Dots -->
  <g opacity="0.12" fill="#38bdf8">
    <circle cx="200" cy="80" r="1.5" /><circle cx="240" cy="80" r="1.5" /><circle cx="280" cy="80" r="1.5" /><circle cx="320" cy="80" r="1.5" /><circle cx="360" cy="80" r="1.5" />
    <circle cx="200" cy="110" r="1.5" /><circle cx="240" cy="110" r="1.5" /><circle cx="280" cy="110" r="1.5" /><circle cx="320" cy="110" r="1.5" /><circle cx="360" cy="110" r="1.5" />
    <circle cx="200" cy="140" r="1.5" /><circle cx="240" cy="140" r="1.5" /><circle cx="280" cy="140" r="1.5" /><circle cx="320" cy="140" r="1.5" /><circle cx="360" cy="140" r="1.5" />
    <circle cx="840" cy="220" r="1.5" /><circle cx="880" cy="220" r="1.5" /><circle cx="920" cy="220" r="1.5" /><circle cx="960" cy="220" r="1.5" /><circle cx="1000" cy="220" r="1.5" />
    <circle cx="840" cy="250" r="1.5" /><circle cx="880" cy="250" r="1.5" /><circle cx="920" cy="250" r="1.5" /><circle cx="960" cy="250" r="1.5" /><circle cx="1000" cy="250" r="1.5" />
    <circle cx="840" cy="280" r="1.5" /><circle cx="880" cy="280" r="1.5" /><circle cx="920" cy="280" r="1.5" /><circle cx="960" cy="280" r="1.5" /><circle cx="1000" cy="280" r="1.5" />
  </g>

  <!-- Left Tech Icon: DevOps Infinity Hexagon -->
  <g transform="translate(100, 100)" class="float-1">
    <polygon points="40,5 75,25 75,65 40,85 5,65 5,25" fill="#0f172a" stroke="#00f2fe" stroke-width="2.5" filter="url(#soft-glow)" />
    <!-- Terraform Logo Mark -->
    <path d="M26 28 L37 34 V48 L26 42 Z" fill="#844fba" />
    <path d="M39 35 L50 28 V42 L39 48 Z" fill="#5c4ee5" />
    <path d="M39 50 L50 43 V57 L39 63 Z" fill="#00d2ff" />
    <path d="M26 44 L37 50 V64 L26 58 Z" fill="#38bdf8" />
  </g>

  <!-- Right Tech Icon: Azure Cloud Hexagon -->
  <g transform="translate(1020, 180)" class="float-2">
    <polygon points="40,5 75,25 75,65 40,85 5,65 5,25" fill="#0f172a" stroke="#7928ca" stroke-width="2.5" filter="url(#soft-glow)" />
    <!-- K8s / Cloud Mark -->
    <circle cx="40" cy="45" r="18" fill="none" stroke="#a855f7" stroke-width="2" />
    <circle cx="40" cy="45" r="8" fill="#a855f7" />
    <line x1="40" y1="27" x2="40" y2="63" stroke="#a855f7" stroke-width="2" />
    <line x1="22" y1="45" x2="58" y2="45" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- Central Header Content -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <!-- Top Super-Tag / Status Pill -->
    <rect x="-195" y="-30" width="390" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="-170" cy="-13" r="5" fill="#10b981" />
    <text x="-150" y="-8" text-anchor="start" fill="#38bdf8" class="exp-pill" letter-spacing="1.2">
      ⚡ SENIOR DEVOPS &amp; CLOUD ARCHITECT
    </text>

    <!-- Main Name -->
    <text x="0" y="55" fill="#ffffff" class="main-title" font-size="44" filter="url(#soft-glow)">
      VIMAL PRATAP SINGH
    </text>

    <!-- Subtitle Role -->
    <text x="0" y="98" fill="#38bdf8" class="sub-title" font-size="19">
      Infrastructure as Code • GitOps • Kubernetes • DevSecOps • FinOps
    </text>

    <!-- Experience Metric Badges -->
    <g transform="translate(0, 130)">
      <!-- DevOps Experience Badge -->
      <g transform="translate(-275, 0)">
        <rect x="0" y="0" width="260" height="46" rx="23" fill="#111827" fill-opacity="0.9" stroke="#00f2fe" stroke-width="1.5" />
        <circle cx="28" cy="23" r="14" fill="#00f2fe" fill-opacity="0.15" />
        <text x="28" y="28" text-anchor="middle" fill="#00f2fe" font-size="16">🚀</text>
        <text x="54" y="21" text-anchor="start" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="14">5+ Years DevOps</text>
        <text x="54" y="37" text-anchor="start" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-weight="500" font-size="11">Production IaC &amp; SRE</text>
      </g>

      <!-- Overall Experience Badge -->
      <g transform="translate(15, 0)">
        <rect x="0" y="0" width="260" height="46" rx="23" fill="#111827" fill-opacity="0.9" stroke="#a855f7" stroke-width="1.5" />
        <circle cx="28" cy="23" r="14" fill="#a855f7" fill-opacity="0.15" />
        <text x="28" y="28" text-anchor="middle" fill="#a855f7" font-size="16">⭐</text>
        <text x="54" y="21" text-anchor="start" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="14">7+ Years IT Overall</text>
        <text x="54" y="37" text-anchor="start" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-weight="500" font-size="11">Systems &amp; Cloud Platform</text>
      </g>
    </g>

    <!-- Pill Tags row -->
    <g transform="translate(0, 205)">
      <!-- Pill 1: Terraform -->
      <g transform="translate(-250, 0)">
        <rect x="0" y="0" width="115" height="28" rx="14" fill="#1e293b" stroke="#844fba" stroke-width="1" />
        <text x="57" y="18" fill="#d8b4fe" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="11.5">Terraform</text>
      </g>
      <!-- Pill 2: Azure -->
      <g transform="translate(-125, 0)">
        <rect x="0" y="0" width="115" height="28" rx="14" fill="#1e293b" stroke="#0078d4" stroke-width="1" />
        <text x="57" y="18" fill="#93c5fd" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="11.5">Azure Cloud</text>
      </g>
      <!-- Pill 3: Kubernetes -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="125" height="28" rx="14" fill="#1e293b" stroke="#326ce5" stroke-width="1" />
        <text x="62" y="18" fill="#60a5fa" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="11.5">Kubernetes AKS</text>
      </g>
      <!-- Pill 4: CI/CD -->
      <g transform="translate(135, 0)">
        <rect x="0" y="0" width="115" height="28" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1" />
        <text x="57" y="18" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="11.5">DevSecOps</text>
      </g>
    </g>
  </g>
</svg>
