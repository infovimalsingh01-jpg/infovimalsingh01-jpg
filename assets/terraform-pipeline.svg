<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 920" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0e1a" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purple-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>

    <linearGradient id="line-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#0078d4" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 240; opacity: 0.3; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.3; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes ringSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseDot {
        0%, 100% { r: 5px; opacity: 0.8; filter: drop-shadow(0 0 4px #00f2fe); }
        50% { r: 7px; opacity: 1; filter: drop-shadow(0 0 10px #00f2fe); }
      }
      .anim-flow {
        stroke-dasharray: 12, 12;
        animation: pulseBeam 4s linear infinite;
      }
      .anim-dot {
        animation: pulseDot 2s ease-in-out infinite;
      }
      .card-box {
        transition: all 0.3s ease;
      }
      .card-box:hover {
        filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.4));
      }
      .step-num {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 800;
        font-size: 14px;
      }
      .title-text {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 700;
        font-size: 16px;
        fill: #f8fafc;
      }
      .sub-text {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 500;
        font-size: 12px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: 'SF Pro Text', 'Fira Code', monospace;
        font-weight: 600;
        font-size: 11px;
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="880" height="920" rx="20" fill="url(#bg-grad)" stroke="#334155" stroke-width="1.5" />

  <!-- Background Cyber Grid pattern -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="0.75">
    <line x1="0" y1="80" x2="880" y2="80" />
    <line x1="0" y1="160" x2="880" y2="160" />
    <line x1="0" y1="240" x2="880" y2="240" />
    <line x1="0" y1="320" x2="880" y2="320" />
    <line x1="0" y1="400" x2="880" y2="400" />
    <line x1="0" y1="480" x2="880" y2="480" />
    <line x1="0" y1="560" x2="880" y2="560" />
    <line x1="0" y1="640" x2="880" y2="640" />
    <line x1="0" y1="720" x2="880" y2="720" />
    <line x1="0" y1="800" x2="880" y2="800" />
    <line x1="100" y1="0" x2="100" y2="920" />
    <line x1="220" y1="0" x2="220" y2="920" />
    <line x1="340" y1="0" x2="340" y2="920" />
    <line x1="460" y1="0" x2="460" y2="920" />
    <line x1="580" y1="0" x2="580" y2="920" />
    <line x1="700" y1="0" x2="700" y2="920" />
    <line x1="820" y1="0" x2="820" y2="920" />
  </g>

  <!-- Header Section -->
  <g transform="translate(440, 50)">
    <!-- Header Badge -->
    <rect x="-190" y="-22" width="380" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="-168" cy="-6" r="5" fill="#00f2fe" class="anim-dot" />
    <text x="-150" y="-1" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" letter-spacing="1.5">ENTERPRISE CLOUD ARCHITECTURE</text>
    
    <!-- Main Title -->
    <text x="0" y="32" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="22" letter-spacing="0.5">Automated DevSecOps &amp; Terraform Pipeline</text>
    <text x="0" y="52" text-anchor="middle" fill="#64748b" font-family="'Segoe UI', sans-serif" font-weight="500" font-size="12">End-to-End GitOps • Zero-Trust Compliance • FinOps Governance • Production Safe</text>
  </g>

  <!-- Central Flow Backbone Line (Glowing Animation) -->
  <line x1="440" y1="125" x2="440" y2="845" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
  <line x1="440" y1="125" x2="440" y2="845" stroke="url(#line-glow)" stroke-width="3" stroke-linecap="round" class="anim-flow" opacity="0.9" />

  <!-- ==================== STAGE 1: Terraform Git Repo ==================== -->
  <g class="card-box" transform="translate(140, 125)">
    <!-- Node Connection Indicator -->
    <circle cx="300" cy="40" r="14" fill="#0f172a" stroke="#f05032" stroke-width="2.5" />
    <circle cx="300" cy="40" r="6" fill="#f05032" />
    
    <!-- Card Container -->
    <rect x="0" y="0" width="600" height="80" rx="14" fill="url(#card-grad)" stroke="#f05032" stroke-width="1.5" />
    
    <!-- Icon Circle -->
    <circle cx="45" cy="40" r="24" fill="#f05032" fill-opacity="0.15" stroke="#f05032" stroke-width="1.5" />
    <!-- Git Branch Icon -->
    <path d="M41 30 a3 3 0 1 1 -2 0 v14 a3 3 0 1 1 -2 0 v-8 a5 5 0 0 1 5 -5 h4 a3 3 0 1 1 0 2 h-4 a3 3 0 0 0 -3 3 v8 a3 3 0 1 1 -2 0" fill="#f05032" />

    <!-- Text Group -->
    <text x="85" y="34" class="title-text">Stage 1: Terraform Git Repository</text>
    <text x="85" y="54" class="sub-text">Modular HCL • Branch Protection • Pull Request Webhook Trigger</text>

    <!-- Stage Pill -->
    <rect x="475" y="27" width="105" height="26" rx="13" fill="#f05032" fill-opacity="0.2" stroke="#f05032" stroke-width="1" />
    <text x="527" y="44" text-anchor="middle" fill="#ff7675" class="badge-text">vcs / gitops</text>
  </g>

  <!-- Flow Arrow 1-2 -->
  <polygon points="436,215 444,215 440,223" fill="#00f2fe" />

  <!-- ==================== STAGE 2: Linting & Format ==================== -->
  <g class="card-box" transform="translate(140, 230)">
    <circle cx="300" cy="40" r="14" fill="#0f172a" stroke="#8a2be2" stroke-width="2.5" />
    <circle cx="300" cy="40" r="6" fill="#8a2be2" />
    
    <rect x="0" y="0" width="600" height="80" rx="14" fill="url(#card-grad)" stroke="#8a2be2" stroke-width="1.5" />
    
    <circle cx="45" cy="40" r="24" fill="#8a2be2" fill-opacity="0.15" stroke="#8a2be2" stroke-width="1.5" />
    <!-- Check / Lint Icon -->
    <path d="M37 40 L43 46 L53 34" stroke="#a855f7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <text x="85" y="34" class="title-text">Stage 2: Code Quality &amp; Linting</text>
    <text x="85" y="54" class="sub-text">terraform fmt (Style Canonical) + tflint (Syntax &amp; Cloud Best Practices)</text>

    <rect x="475" y="27" width="105" height="26" rx="13" fill="#8a2be2" fill-opacity="0.2" stroke="#8a2be2" stroke-width="1" />
    <text x="527" y="44" text-anchor="middle" fill="#c084fc" class="badge-text">code quality</text>
  </g>

  <!-- Flow Arrow 2-3 -->
  <polygon points="436,320 444,320 440,328" fill="#00f2fe" />

  <!-- ==================== STAGE 3: Security Scanning ==================== -->
  <g class="card-box" transform="translate(140, 335)">
    <circle cx="300" cy="40" r="14" fill="#0f172a" stroke="#ef4444" stroke-width="2.5" />
    <circle cx="300" cy="40" r="6" fill="#ef4444" />
    
    <rect x="0" y="0" width="600" height="80" rx="14" fill="url(#card-grad)" stroke="#ef4444" stroke-width="1.5" />
    
    <circle cx="45" cy="40" r="24" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1.5" />
    <!-- Shield Security Icon -->
    <path d="M45 28 L55 32 V41 C55 47 45 52 45 52 C45 52 35 47 35 41 V32 Z" fill="none" stroke="#f87171" stroke-width="2.5" stroke-linejoin="round" />

    <text x="85" y="34" class="title-text">Stage 3: Security &amp; Vulnerability SAST</text>
    <text x="85" y="54" class="sub-text">tfsec (Misconfigurations) • Checkov (Policy as Code) • Trivy (CVE Audit)</text>

    <rect x="475" y="27" width="105" height="26" rx="13" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1" />
    <text x="527" y="44" text-anchor="middle" fill="#fca5a5" class="badge-text">shift-left sec</text>
  </g>

  <!-- Flow Arrow 3-4 -->
  <polygon points="436,425 444,425 440,433" fill="#00f2fe" />

  <!-- ==================== STAGE 4: Cost Estimation ==================== -->
  <g class="card-box" transform="translate(140, 440)">
    <circle cx="300" cy="40" r="14" fill="#0f172a" stroke="#10b981" stroke-width="2.5" />
    <circle cx="300" cy="40" r="6" fill="#10b981" />
    
    <rect x="0" y="0" width="600" height="80" rx="14" fill="url(#card-grad)" stroke="#10b981" stroke-width="1.5" />
    
    <circle cx="45" cy="40" r="24" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" />
    <!-- Dollar / FinOps Icon -->
    <text x="45" y="47" text-anchor="middle" fill="#34d399" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="22">$</text>

    <text x="85" y="34" class="title-text">Stage 4: Cloud Cost Estimation (FinOps)</text>
    <text x="85" y="54" class="sub-text">Infracost Breakdown • Monthly Spend Forecast • PR Budget Guardrails</text>

    <rect x="475" y="27" width="105" height="26" rx="13" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
    <text x="527" y="44" text-anchor="middle" fill="#6ee7b7" class="badge-text">finops / cost</text>
  </g>

  <!-- Flow Arrow 4-5 -->
  <polygon points="436,530 444,530 440,538" fill="#00f2fe" />

  <!-- ==================== STAGE 5: Terraform Plan & Drift Detection ==================== -->
  <g class="card-box" transform="translate(140, 545)">
    <circle cx="300" cy="40" r="14" fill="#0f172a" stroke="#0284c7" stroke-width="2.5" />
    <circle cx="300" cy="40" r="6" fill="#0284c7" />
    
    <rect x="0" y="0" width="600" height="80" rx="14" fill="url(#card-grad)" stroke="#0284c7" stroke-width="1.5" />
    
    <circle cx="45" cy="40" r="24" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1.5" />
    <!-- Eye / Radar Plan Icon -->
    <ellipse cx="45" cy="40" rx="10" ry="6" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="45" cy="40" r="3" fill="#38bdf8" />

    <text x="85" y="34" class="title-text">Stage 5: Plan &amp; Automated Drift Detection</text>
    <text x="85" y="54" class="sub-text">Speculative terraform plan • Scheduled Cron Drift Sync • Lock Verification</text>

    <rect x="475" y="27" width="105" height="26" rx="13" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1" />
    <text x="527" y="44" text-anchor="middle" fill="#7dd3fc" class="badge-text">drift / plan</text>
  </g>

  <!-- Flow Arrow 5-6 -->
  <polygon points="436,635 444,635 440,643" fill="#00f2fe" />

  <!-- ==================== STAGE 6: Manual Peer Approval Gate ==================== -->
  <g class="card-box" transform="translate(140, 650)">
    <circle cx="300" cy="40" r="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5" />
    <circle cx="300" cy="40" r="6" fill="#f59e0b" />
    
    <rect x="0" y="0" width="600" height="80" rx="14" fill="url(#card-grad)" stroke="#f59e0b" stroke-width="1.5" />
    
    <circle cx="45" cy="40" r="24" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5" />
    <!-- Keyhole / User Approval Gate Icon -->
    <circle cx="45" cy="36" r="4.5" fill="none" stroke="#fbbf24" stroke-width="2" />
    <path d="M43 41 H47 L48 46 H42 Z" fill="#fbbf24" />

    <text x="85" y="34" class="title-text">Stage 6: Manual Peer Approval (Prod Gate)</text>
    <text x="85" y="54" class="sub-text">Multi-Peer Review • Change Advisory Board (CAB) • RBAC Audit Trail</text>

    <rect x="475" y="27" width="105" height="26" rx="13" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" />
    <text x="527" y="44" text-anchor="middle" fill="#fde68a" class="badge-text">prod gate</text>
  </g>

  <!-- Flow Arrow 6-7 -->
  <polygon points="436,740 444,740 440,748" fill="#00f2fe" />

  <!-- ==================== STAGE 7: Terraform Apply & Azure Blob State Lock ==================== -->
  <g class="card-box" transform="translate(140, 755)">
    <circle cx="300" cy="40" r="14" fill="#0f172a" stroke="#0078d4" stroke-width="2.5" />
    <circle cx="300" cy="40" r="6" fill="#0078d4" />
    
    <rect x="0" y="0" width="600" height="80" rx="14" fill="url(#card-grad)" stroke="#0078d4" stroke-width="2" filter="url(#subtle-glow)" />
    
    <circle cx="45" cy="40" r="24" fill="#0078d4" fill-opacity="0.2" stroke="#0078d4" stroke-width="1.5" />
    <!-- Azure Cloud / Safe Vault Icon -->
    <path d="M38 45 C36 45 34 43 34 41 C34 39 36 37 38 37 C39 34 42 32 45 32 C48 32 51 34 52 37 C54 37 56 39 56 41 C56 43 54 45 52 45 Z" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linejoin="round" />
    <circle cx="45" cy="41" r="2" fill="#60a5fa" />

    <text x="85" y="34" class="title-text">Stage 7: Terraform Apply (Locked Remote State)</text>
    <text x="85" y="54" class="sub-text">Target Cloud Provisioning • Azure Blob Lease Lock • Encrypted State Backend</text>

    <rect x="475" y="27" width="105" height="26" rx="13" fill="#0078d4" fill-opacity="0.25" stroke="#0078d4" stroke-width="1" />
    <text x="527" y="44" text-anchor="middle" fill="#93c5fd" class="badge-text">azure storage</text>
  </g>

  <!-- Bottom Metric / Status Ribbon -->
  <g transform="translate(440, 875)">
    <rect x="-310" y="-18" width="620" height="36" rx="18" fill="#111827" stroke="#334155" stroke-width="1" />
    <circle cx="-285" cy="0" r="5" fill="#10b981" />
    <text x="-270" y="4" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="11.5">
      PIPELINE HEALTH: <tspan fill="#10b981">100% AUTOMATED</tspan> • DRIFT RESILIENT • ZERO-TRUST GOVERNANCE
    </text>
  </g>
</svg>
